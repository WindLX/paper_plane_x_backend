services:
  backend:
    build:
      context: ..
      dockerfile: paper_plane_x_backend/Dockerfile
    container_name: paper-plane-x-backend
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/paper_plane_x_backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
