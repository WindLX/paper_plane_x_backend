app_name = "Paper Plane X"
debug = true
data_dir = "./data"
database_path = "./data/app.db"
prompts_dir = "./prompts"

[api]
host = "127.0.0.1"
port = 8000
reload = true
cors_allow_origins = ["*"]
console_dist_dir = "./data/console"

[log]
level = "DEBUG"
app_only = true
to_file = true
file_path = "./data/logs/backend.dev.log"
file_max_bytes = 10485760
file_backup_count = 5
