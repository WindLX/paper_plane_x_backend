app_name = "Paper Plane X"
debug = true
data_dir = "./data"
database_path = "./data/app.db"
prompts_dir = "./prompts"

[api]
host = "127.0.0.1"
port = 8000
reload = true
cors_allow_origins = ["*"]
console_dist_dir = "./data/console"

[log]
level = "DEBUG"
app_only = true
to_file = true
file_path = "./data/logs/backend.dev.log"
file_max_bytes = 10485760
file_backup_count = 5

[mineru]
base_url = "http://localhost:7860"
output_dir = "./data/papers"

[data_process]
max_retries = 3
worker_count = 5
shutdown_timeout = 5.0
task_max_seconds = 600.0

[librarian]
top_tags_limit = 8

[llm]
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com/v1"
api_key = ""
temperature = 0.7
max_tokens = 8192
timeout = 180.0
thinking_enabled = false
is_vlm = false

[agent_llm.extraction]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"
thinking_enabled = true
reasoning_effort = "high"
temperature = 0.3
max_tokens = 8192

[agent_llm.analysis]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"
thinking_enabled = true
reasoning_effort = "high"
temperature = 0.3
max_tokens = 8192

[agent_llm.fact_check]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"
temperature = 0.1
max_tokens = 8192
