# Paper Plane X backend default configuration
# You can override this file path via env var: PPX_CONFIG_FILE=/abs/path/to/your.toml
app_name = "Paper Plane X"
debug = false
data_dir = "./data"
database_path = "./data/app.db"
prompts_dir = "./prompts"

[api]
host = "127.0.0.1"
port = 8000
reload = false
graceful_shutdown_timeout = 5
cors_allow_origins = ["*"]
# ssl_certfile = "./certs/cert.pem"
# ssl_keyfile = "./certs/key.pem"
console_dist_dir = "./data/console"

[log]
level = "INFO"
app_only = true
to_file = true
file_path = "./data/logs/backend.log"
file_max_bytes = 10485760
file_backup_count = 5
