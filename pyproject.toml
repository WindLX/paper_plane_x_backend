[project]
name = "paper-plane-x-backend"
version = "0.1.2"
description = "AI Agent-powered research survey workflow system"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "windlx", email = "1418043337@qq.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "uvicorn>=0.46.0",
    "fastapi[standard]>=0.136.1",
    "litellm>=1.83.14",
    "pydantic-settings>=2.14.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "rtoml>=0.13.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "httpx>=0.28.0",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]

[project.scripts]
app = "paper_plane_x_backend.main:run"
debug = "paper_plane_x_backend.main:debug"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
strict = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_plane_x_backend"]
